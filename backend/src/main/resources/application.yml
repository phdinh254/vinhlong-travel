server:
  port: ${SERVER_PORT:8081}

spring:
  application:
    name: vinhlong-tour
  datasource:
    # Mặc định khớp docker-compose.yml ở thư mục gốc dự án
    url: ${DB_URL:jdbc:mysql://localhost:3306/vinhlongtour}
    username: ${DB_USER:vinhlong}
    password: ${DB_PASSWORD:vinhlong}
  servlet:
    multipart:
      max-file-size: 5MB      # Ảnh tải lên tối đa 5 MB
      max-request-size: 6MB
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate   # Bảng do Flyway tạo (src/main/resources/db/migration), Hibernate chỉ kiểm tra
    properties:
      # Nạp quan hệ (khu vực, loại hình...) của cả trang kết quả trong một câu truy vấn, tránh mỗi dòng một truy vấn
      hibernate.default_batch_fetch_size: 50

app:
  jwt:
    secret: ${JWT_SECRET:}   # Ít nhất 32 ký tự. Để trống: sinh khóa ngẫu nhiên mỗi lần chạy (token mất hiệu lực khi khởi động lại)
    ttl: 2h
  admin:                     # Tài khoản admin đầu tiên, chỉ tạo khi CSDL chưa có admin
    email: ${ADMIN_EMAIL:admin@vinhlongtour.vn}
    password: ${ADMIN_PASSWORD:}
  google:
    client-id: ${GOOGLE_CLIENT_ID:}
  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:5173}
  booking:
    hold: 30m                # Giữ chỗ 30 phút; quá hạn mà chưa trả đồng nào thì tự trả chỗ
    deposit-percent: 30      # Đặt cọc tối thiểu 30% tổng tiền, làm tròn lên hàng nghìn
  payos:                     # Đăng ký miễn phí ở https://my.payos.vn → Kênh thanh toán → lấy Client ID, Api Key, Checksum Key
    client-id: ${PAYOS_CLIENT_ID:}
    api-key: ${PAYOS_API_KEY:}
    checksum-key: ${PAYOS_CHECKSUM_KEY:}
    api-url: ${PAYOS_API_URL:https://api-merchant.payos.vn}
    return-url: ${PAYOS_RETURN_URL:http://localhost:5173/thanh-toan/ket-qua}   # Trang kết quả của frontend
    cancel-url: ${PAYOS_CANCEL_URL:http://localhost:5173/thanh-toan/ket-qua}
    link-timeout: 15m        # Link thanh toán payOS hết hạn sau 15 phút
  upload:
    dir: ${UPLOAD_DIR:uploads}   # Thư mục lưu ảnh tải lên (đã có trong .gitignore)
