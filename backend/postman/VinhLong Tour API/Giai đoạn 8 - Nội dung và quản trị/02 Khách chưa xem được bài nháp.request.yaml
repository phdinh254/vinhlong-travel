$kind: http-request
url: "{{baseUrl}}/api/v1/articles/{{articleSlug}}"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test('Trả 404', () => pm.response.to.have.status(404));
      pm.test('code = NOT_FOUND', () => pm.expect(pm.response.json().code).to.eql('NOT_FOUND'));
    language: text/javascript
order: 3000
