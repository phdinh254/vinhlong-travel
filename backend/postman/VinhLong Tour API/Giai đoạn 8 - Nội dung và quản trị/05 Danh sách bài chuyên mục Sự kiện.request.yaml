$kind: http-request
url: "{{baseUrl}}/api/v1/articles?category=EVENT&size=50"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test('Trả 200', () => pm.response.to.have.status(200));
      pm.test('Có bài vừa xuất bản, không kèm nội dung', () => { const a = pm.response.json().items.find(x => x.id == pm.collectionVariables.get('articleId')); pm.expect(a).to.exist; pm.expect(a.content).to.eql(undefined); });
    language: text/javascript
order: 6000
