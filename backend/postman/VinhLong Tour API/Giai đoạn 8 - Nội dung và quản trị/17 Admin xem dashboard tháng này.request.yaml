$kind: http-request
url: "{{baseUrl}}/api/v1/admin/dashboard"
method: GET
headers:
  Authorization: Bearer {{adminToken}}
scripts:
  - type: afterResponse
    code: |-
      pm.test('Trả 200', () => pm.response.to.have.status(200));
      const d = pm.response.json();
      pm.test('Doanh thu thực = đã thu − đã hoàn', () => pm.expect(d.netRevenue).to.eql(d.collected - d.refunded));
      pm.test('Đủ 6 trạng thái đơn, tổng khớp số đơn mới', () => { pm.expect(Object.keys(d.bookingsByStatus).length).to.eql(6); pm.expect(Object.values(d.bookingsByStatus).reduce((a, b) => a + b, 0)).to.eql(d.newBookings); });
      pm.test('Có số việc cần làm', () => { pm.expect(d.bookingsNeedingRefund).to.be.a('number'); pm.expect(d.pendingCancellationRequests).to.be.a('number'); pm.expect(d.recentBookings.length).to.be.at.most(5); });
    language: text/javascript
order: 18000
