$kind: http-request
url: "{{baseUrl}}{{uploadUrl}}"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test('Trả 200', () => pm.response.to.have.status(200));
      pm.test('Đúng kiểu ảnh PNG', () => pm.expect(pm.response.headers.get('Content-Type')).to.include('image/png'));
    language: text/javascript
order: 16000
