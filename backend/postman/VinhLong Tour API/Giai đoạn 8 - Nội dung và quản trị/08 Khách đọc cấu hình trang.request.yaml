$kind: http-request
url: "{{baseUrl}}/api/v1/site-settings"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test('Trả 200', () => pm.response.to.have.status(200));
      const s = pm.response.json();
      pm.test('Đủ 13 mục, mục chưa nhập là chuỗi rỗng', () => { pm.expect(Object.keys(s).length).to.eql(13); pm.expect(s.HOTLINE).to.eql('0270 3 822 222'); pm.expect(s.TIKTOK_URL).to.be.a('string'); });
    language: text/javascript
order: 9000
