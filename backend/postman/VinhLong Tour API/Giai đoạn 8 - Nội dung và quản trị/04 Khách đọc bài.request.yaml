$kind: http-request
url: "{{baseUrl}}/api/v1/articles/{{articleSlug}}"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test('Trả 200', () => pm.response.to.have.status(200));
      pm.test('Lượt xem tăng lên 1', () => pm.expect(pm.response.json().viewCount).to.eql(1));
    language: text/javascript
order: 5000
