$kind: http-request
url: "{{baseUrl}}/api/v1/admin/passenger-types"
method: POST
headers:
  Authorization: Bearer {{adminToken}}
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "name": "Thiếu niên",
      "minAge": 10,
      "maxAge": 15,
      "seats": 1
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('Trả 409', () => pm.response.to.have.status(409));
      pm.test('code = AGE_RANGE_OVERLAP', () => pm.expect(pm.response.json().code).to.eql('AGE_RANGE_OVERLAP'));
    language: text/javascript
order: 14000
