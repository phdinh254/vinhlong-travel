$kind: http-request
url: "{{baseUrl}}/api/v1/tour-categories"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test('Trả 200', () => pm.response.to.have.status(200));
      const beach = pm.response.json().find(c => c.name === 'Biển');
      pm.test('Có loại hình Biển', () => pm.expect(beach).to.exist);
      pm.collectionVariables.set('categoryBeachId', beach.id);
    language: text/javascript
order: 3000
