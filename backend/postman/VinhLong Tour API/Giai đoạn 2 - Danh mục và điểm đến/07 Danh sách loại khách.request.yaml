$kind: http-request
url: "{{baseUrl}}/api/v1/passenger-types"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test('Trả 200', () => pm.response.to.have.status(200));
      pm.test('Người lớn đứng đầu (tuổi lớn nhất)', () => pm.expect(pm.response.json()[0].name).to.eql('Người lớn'));
    language: text/javascript
order: 8000
