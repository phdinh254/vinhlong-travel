$kind: http-request
url: "{{baseUrl}}/api/v1/destinations?categoryId={{categoryBeachId}}"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test('Trả 200', () => pm.response.to.have.status(200));
