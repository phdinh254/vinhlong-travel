$kind: http-request
url: "{{baseUrl}}/api/v1/admin/regions"
method: POST
headers:
  Authorization: Bearer {{adminToken}}
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "name": "{{newRegionName}}"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('Trả 409', () => pm.response.to.have.status(409));
      pm.test('code = NAME_TAKEN', () => pm.expect(pm.response.json().code).to.eql('NAME_TAKEN'));
    language: text/javascript
order: 11000
