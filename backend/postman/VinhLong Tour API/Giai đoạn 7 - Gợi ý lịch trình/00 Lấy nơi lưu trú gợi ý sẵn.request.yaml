$kind: http-request
url: "{{baseUrl}}/api/v1/itineraries/lodging-presets"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test('Trả 200', () => pm.response.to.have.status(200));
      pm.test('Có 4 nơi lưu trú, mỗi nơi có tọa độ', () => { const l = pm.response.json(); pm.expect(l.length).to.eql(4); l.forEach(x => pm.expect(x.latitude).to.be.a('number')); });
    language: text/javascript
order: 1000
