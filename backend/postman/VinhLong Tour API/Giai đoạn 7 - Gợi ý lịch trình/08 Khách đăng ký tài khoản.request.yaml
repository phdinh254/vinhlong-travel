$kind: http-request
url: "{{baseUrl}}/api/v1/auth/register"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "email": "lichtrinh-{{$timestamp}}@test.vn",
      "password": "MatKhau@123",
      "fullName": "Khách lưu lịch trình"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('Trả 201', () => pm.response.to.have.status(201));
      pm.collectionVariables.set('tripToken', pm.response.json().token);
    language: text/javascript
order: 9000
