$kind: http-request
url: "{{baseUrl}}/api/v1/khong-ton-tai"
method: GET
scripts:
  - type: afterResponse
    code: |-
      // Từ giai đoạn 1, mọi API mặc định cần đăng nhập nên chưa có token sẽ nhận 401 trước khi xét đường dẫn
      pm.test('Trả 401', () => pm.response.to.have.status(401));
      pm.test('Đúng dạng lỗi chung {code, message, fields}', () => {
        const body = pm.response.json();
        pm.expect(body.code).to.eql('UNAUTHORIZED');
        pm.expect(body).to.have.property('message');
        pm.expect(body).to.have.property('fields');
      });
    language: text/javascript
order: 4000
