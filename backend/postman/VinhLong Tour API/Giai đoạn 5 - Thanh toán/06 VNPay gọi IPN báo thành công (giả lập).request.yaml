$kind: http-request
url: "{{baseUrl}}/api/v1/payments/vnpay/ipn?{{ipnQuery}}"
method: GET
scripts:
  - type: beforeRequest
    code: |-
      // Giả lập VNPay: ký dữ liệu bằng HMAC-SHA512 với vnpHashSecret (phải trùng VNPAY_HASH_SECRET của backend)
      const CryptoJS = require('crypto-js');
      const p = {
        vnp_TmnCode: 'TESTTMN1', vnp_TxnRef: pm.collectionVariables.get('vnpRef'),
        vnp_Amount: String(Number(pm.collectionVariables.get('vnpAmount')) * 100),
        vnp_ResponseCode: '00', vnp_TransactionStatus: '00', vnp_TransactionNo: '14' + Date.now().toString().slice(-6),
        vnp_BankCode: 'NCB', vnp_PayDate: '20261114103000', vnp_OrderInfo: 'Thanh toan don'
      };
      const enc = s => encodeURIComponent(s).replace(/%20/g, '+').replace(/[!'()~]/g, c => '%' + c.charCodeAt(0).toString(16).toUpperCase());
      const canon = Object.keys(p).sort().map(k => enc(k) + '=' + enc(p[k])).join('&');
      const hash = CryptoJS.HmacSHA512(canon, pm.variables.get('vnpHashSecret')).toString(CryptoJS.enc.Hex);
      pm.collectionVariables.set('ipnQuery', canon + '&vnp_SecureHash=' + hash);
      pm.collectionVariables.set('ipnForgedQuery', canon + '&vnp_SecureHash=' + hash.replace(/^./, c => c === 'a' ? 'b' : 'a'));
    language: text/javascript
  - type: afterResponse
    code: |-
      pm.test('Trả 200', () => pm.response.to.have.status(200));
      pm.test('RspCode = 00 (đã ghi nhận)', () => pm.expect(pm.response.json().RspCode).to.eql('00'));
    language: text/javascript
order: 7000
