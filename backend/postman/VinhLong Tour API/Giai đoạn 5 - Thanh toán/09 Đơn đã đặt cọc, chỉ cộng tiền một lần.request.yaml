$kind: http-request
url: "{{baseUrl}}/api/v1/bookings/lookup?code={{payBookingCode}}&phone=0907654321"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test('Trả 200', () => pm.response.to.have.status(200));
      const b = pm.response.json();
      pm.test('Trạng thái DEPOSITED, đã thu đúng tiền cọc', () => {
        pm.expect(b.status).to.eql('DEPOSITED');
        pm.expect(b.paidAmount).to.eql(Number(pm.collectionVariables.get('vnpAmount')));
        pm.expect(b.payments[0].status).to.eql('SUCCEEDED');
      });
      pm.collectionVariables.set('payRemaining', b.remainingAmount);
    language: text/javascript
order: 10000
