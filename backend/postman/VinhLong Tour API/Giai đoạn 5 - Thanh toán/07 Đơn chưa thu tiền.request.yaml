$kind: http-request
url: "{{baseUrl}}/api/v1/bookings/lookup?code={{payBookingCode}}&phone=0907654321"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test('Trả 200', () => pm.response.to.have.status(200));
      const b = pm.response.json();
      pm.test('Vẫn chờ thanh toán, không có khoản thanh toán treo', () => {
        pm.expect(b.status).to.eql('PENDING_PAYMENT');
        pm.expect(b.paidAmount).to.eql(0);
        pm.expect(b.payments).to.have.lengthOf(0);
      });
      pm.collectionVariables.set('payRemaining', b.remainingAmount);
    language: text/javascript
order: 8000
