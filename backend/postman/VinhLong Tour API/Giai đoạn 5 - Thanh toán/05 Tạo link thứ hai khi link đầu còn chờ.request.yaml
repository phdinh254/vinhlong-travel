$kind: http-request
url: "{{baseUrl}}/api/v1/payments/vnpay"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "bookingCode": "{{payBookingCode}}",
      "phone": "0907654321",
      "type": "FULL"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('Trả 409', () => pm.response.to.have.status(409));
      pm.test('code = PAYMENT_IN_PROGRESS', () => pm.expect(pm.response.json().code).to.eql('PAYMENT_IN_PROGRESS'));
    language: text/javascript
order: 6000
