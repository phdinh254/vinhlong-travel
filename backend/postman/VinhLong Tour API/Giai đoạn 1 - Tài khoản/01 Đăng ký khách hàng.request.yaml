$kind: http-request
url: "{{baseUrl}}/api/v1/auth/register"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "email": "{{customerEmail}}",
      "password": "MatKhau@123",
      "fullName": "Nguyễn Văn A",
      "phone": "0901234567"
    }
scripts:
  - type: beforeRequest
    code: pm.collectionVariables.set('customerEmail', 'kh-' + Date.now() + '@test.vn');
    language: text/javascript
  - type: afterResponse
    code: |-
      pm.test('Trả 201', () => pm.response.to.have.status(201));
      const body = pm.response.json();
      pm.test('Có token và vai trò CUSTOMER', () => {
        pm.expect(body.token).to.be.a('string');
        pm.expect(body.account.role).to.eql('CUSTOMER');
      });
      pm.collectionVariables.set('customerToken', body.token);
      pm.collectionVariables.set('customerId', body.account.id);
    language: text/javascript
order: 1000
