$kind: http-request
url: "{{baseUrl}}/api/v1/admin/accounts?q={{customerEmail}}"
method: GET
headers:
  Authorization: Bearer {{adminToken}}
scripts:
  - type: afterResponse
    code: |-
      pm.test('Trả 200', () => pm.response.to.have.status(200));
      const body = pm.response.json();
      pm.test('Tìm thấy đúng 1 tài khoản', () => {
        pm.expect(body.total).to.eql(1);
        pm.expect(body.items[0].email).to.eql(pm.collectionVariables.get('customerEmail'));
      });
    language: text/javascript
order: 11000
