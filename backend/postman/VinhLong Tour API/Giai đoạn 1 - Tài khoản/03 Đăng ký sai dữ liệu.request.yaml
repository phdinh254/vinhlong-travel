$kind: http-request
url: "{{baseUrl}}/api/v1/auth/register"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "email": "khong-phai-email",
      "password": "ngan",
      "fullName": "A"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('Trả 400', () => pm.response.to.have.status(400));
      const body = pm.response.json();
      pm.test('code = VALIDATION_FAILED, chỉ ra trường email và password', () => {
        pm.expect(body.code).to.eql('VALIDATION_FAILED');
        pm.expect(body.fields).to.have.property('email');
        pm.expect(body.fields).to.have.property('password');
      });
    language: text/javascript
order: 3000
