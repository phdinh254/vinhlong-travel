$kind: http-request
url: "{{baseUrl}}/api/v1/me"
method: GET
headers:
  Authorization: Bearer {{customerToken}}
scripts:
  - type: afterResponse
    code: |-
      pm.test('Trả 403', () => pm.response.to.have.status(403));
      pm.test('code = ACCOUNT_LOCKED', () => pm.expect(pm.response.json().code).to.eql('ACCOUNT_LOCKED'));
    language: text/javascript
order: 13000
