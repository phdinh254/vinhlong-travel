$kind: http-request
url: "{{baseUrl}}/api/v1/me"
method: GET
headers:
  Authorization: Bearer {{customerToken}}
scripts:
  - type: afterResponse
    code: |-
      pm.test('Trả 200', () => pm.response.to.have.status(200));
      pm.test('Đúng email vừa đăng ký', () => pm.expect(pm.response.json().email).to.eql(pm.collectionVariables.get('customerEmail')));
    language: text/javascript
order: 6000
