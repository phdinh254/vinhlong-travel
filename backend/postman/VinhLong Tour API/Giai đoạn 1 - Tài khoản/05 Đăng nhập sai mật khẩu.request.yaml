$kind: http-request
url: "{{baseUrl}}/api/v1/auth/login"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "email": "{{customerEmail}}",
      "password": "SaiMatKhau@1"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('Trả 401', () => pm.response.to.have.status(401));
      pm.test('code = INVALID_CREDENTIALS', () => pm.expect(pm.response.json().code).to.eql('INVALID_CREDENTIALS'));
    language: text/javascript
order: 5000
