$kind: http-request
url: "{{baseUrl}}/api/v1/me/password"
method: PUT
headers:
  Authorization: Bearer {{customerToken}}
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "currentPassword": "MatKhau@123",
      "newPassword": "MatKhauMoi@456"
    }
scripts:
  - type: afterResponse
    code: pm.test('Trả 204', () => pm.response.to.have.status(204));
    language: text/javascript
order: 15000
