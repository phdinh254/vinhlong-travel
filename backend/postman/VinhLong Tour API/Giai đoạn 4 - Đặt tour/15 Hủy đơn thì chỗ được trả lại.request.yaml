$kind: http-request
url: "{{baseUrl}}/api/v1/departures/{{bookDepartureId}}"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test('Trả 200', () => pm.response.to.have.status(200));
      pm.test('Chỉ còn đơn thứ hai giữ 2 chỗ', () => pm.expect(pm.response.json().seatsLeft).to.eql(Number(pm.collectionVariables.get('seatsBefore')) - 2));
    language: text/javascript
order: 16000
