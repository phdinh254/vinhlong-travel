$kind: http-request
url: "{{baseUrl}}/api/v1/bookings/lookup?code={{guestBookingCode}}&phone=0901234567"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test('Trả 200', () => pm.response.to.have.status(200));
      pm.test('Đúng đơn, 2 hành khách', () => pm.expect(pm.response.json().passengers.length).to.eql(2));
    language: text/javascript
order: 6000
