$kind: http-request
url: "{{baseUrl}}/api/v1/bookings/lookup?code={{guestBookingCode}}&phone=0999999999"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test('Trả 404', () => pm.response.to.have.status(404));
      pm.test('code = BOOKING_NOT_FOUND', () => pm.expect(pm.response.json().code).to.eql('BOOKING_NOT_FOUND'));
    language: text/javascript
order: 7000
