$kind: http-request
url: "{{baseUrl}}/api/v1/departures/{{bookDepartureId}}"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test('Trả 200', () => pm.response.to.have.status(200));
      pm.test('Hai đơn, mỗi đơn 2 chỗ', () => pm.expect(pm.response.json().seatsLeft).to.eql(Number(pm.collectionVariables.get('seatsBefore')) - 4));
    language: text/javascript
order: 12000
