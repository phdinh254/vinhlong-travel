$kind: http-request
url: "{{baseUrl}}/api/v1/tours?size=50"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test('Trả 200', () => pm.response.to.have.status(200));
      const tour = pm.response.json().items.find(t => t.fromPrice !== null);
      pm.test('Có tour đang bán còn đợt đặt được (chạy giai đoạn 3 trước nếu chưa có)', () => pm.expect(tour).to.exist);
      pm.collectionVariables.set('bookTourId', tour.id);
      const year = new Date().getFullYear();
      pm.collectionVariables.set('childBirthDate', (year - 8) + '-06-15');
    language: text/javascript
order: 2000
