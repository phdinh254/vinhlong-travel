$kind: collection
description: |-
  Bộ request kiểm thử backend VinhLong Tour. Mỗi giai đoạn thêm một thư mục mới.
  Chạy cả collection theo thứ tự (Run). Biến `adminPassword` phải khớp ADMIN_PASSWORD đã đặt khi chạy backend.
  Biến `vnpHashSecret` phải khớp VNPAY_HASH_SECRET của backend (giai đoạn 5 tự ký dữ liệu để giả lập VNPay).
  Đổi biến `baseUrl` nếu backend không chạy ở cổng 8081.
variables:
  baseUrl: http://localhost:8081
  adminEmail: admin@vinhlongtour.vn
  adminPassword: ""
  vnpHashSecret: ""
