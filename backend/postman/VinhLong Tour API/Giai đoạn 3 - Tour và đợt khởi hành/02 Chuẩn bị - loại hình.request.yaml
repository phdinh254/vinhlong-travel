$kind: http-request
url: "{{baseUrl}}/api/v1/tour-categories"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.collectionVariables.set('categoryCultureId', pm.response.json().find(c => c.name === 'Văn hóa').id);
      pm.test('Trả 200', () => pm.response.to.have.status(200));
    language: text/javascript
order: 3000
