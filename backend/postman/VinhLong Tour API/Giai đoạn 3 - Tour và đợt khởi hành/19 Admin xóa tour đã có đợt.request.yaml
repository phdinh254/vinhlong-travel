$kind: http-request
url: "{{baseUrl}}/api/v1/admin/tours/{{tourId}}"
method: DELETE
headers:
  Authorization: Bearer {{adminToken}}
scripts:
  - type: afterResponse
    code: |-
      pm.test('Trả 409', () => pm.response.to.have.status(409));
      pm.test('code = DATA_CONFLICT', () => pm.expect(pm.response.json().code).to.eql('DATA_CONFLICT'));
    language: text/javascript
order: 20000
