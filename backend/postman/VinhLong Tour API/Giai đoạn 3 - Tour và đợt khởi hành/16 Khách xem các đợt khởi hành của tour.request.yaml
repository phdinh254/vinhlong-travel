$kind: http-request
url: "{{baseUrl}}/api/v1/tours/{{tourId}}/departures"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test('Trả 200', () => pm.response.to.have.status(200));
      const d = pm.response.json()[0];
      pm.test('Một đợt đặt được, giá người lớn đứng đầu', () => {
        pm.expect(d.bookable).to.eql(true);
        pm.expect(d.prices[0].price).to.eql(900000);
      });
    language: text/javascript
order: 17000
