$kind: http-request
url: "{{baseUrl}}/api/v1/regions"
method: GET
scripts:
  - type: afterResponse
    code: |-
      const regions = pm.response.json();
      pm.collectionVariables.set('regionVinhLongId', regions.find(r => r.name === 'Vĩnh Long (cũ)').id);
      pm.collectionVariables.set('regionTraVinhId', regions.find(r => r.name === 'Trà Vinh (cũ)').id);
      pm.test('Trả 200', () => pm.response.to.have.status(200));
    language: text/javascript
order: 2000
