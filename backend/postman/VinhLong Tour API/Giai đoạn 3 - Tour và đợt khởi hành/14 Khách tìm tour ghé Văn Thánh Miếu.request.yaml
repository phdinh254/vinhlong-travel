$kind: http-request
url: "{{baseUrl}}/api/v1/tours?destinationId={{vl01Id}}&size=50"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test('Trả 200', () => pm.response.to.have.status(200));
      const tour = pm.response.json().items.find(t => t.id == pm.collectionVariables.get('tourId'));
      pm.test('Có tour vừa mở bán, giá từ 900.000đ', () => {
        pm.expect(tour).to.exist;
        pm.expect(tour.fromPrice).to.eql(900000);
        pm.expect(tour.coverImageUrl).to.eql('/uploads/van-thanh-mieu.jpg');
      });
    language: text/javascript
order: 15000
