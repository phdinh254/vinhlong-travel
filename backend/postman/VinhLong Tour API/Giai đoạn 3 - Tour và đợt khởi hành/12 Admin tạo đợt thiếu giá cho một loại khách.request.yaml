$kind: http-request
url: "{{baseUrl}}/api/v1/admin/tours/{{tourId}}/departures"
method: POST
headers:
  Authorization: Bearer {{adminToken}}
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "departureAt": "{{departureAt}}",
      "returnAt": "{{returnAt}}",
      "bookingDeadline": "{{bookingDeadline}}",
      "capacity": 25,
      "prices": {{onePriceJson}}
    }
scripts:
  - type: beforeRequest
    code: |-
      const fmt = ms => new Date(ms).toISOString().slice(0, 19);
      const start = Math.floor((Date.now() + 30 * 864e5) / 36e5) * 36e5;
      pm.collectionVariables.set('departureAt', fmt(start));
      pm.collectionVariables.set('returnAt', fmt(start + 34 * 36e5));
      pm.collectionVariables.set('bookingDeadline', fmt(start - 24 * 36e5));
    language: text/javascript
  - type: afterResponse
    code: |-
      pm.test('Trả 400', () => pm.response.to.have.status(400));
      pm.test('code = MISSING_PRICE', () => pm.expect(pm.response.json().code).to.eql('MISSING_PRICE'));
    language: text/javascript
order: 13000
