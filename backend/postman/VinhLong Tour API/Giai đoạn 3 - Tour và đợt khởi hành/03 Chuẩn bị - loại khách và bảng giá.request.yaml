$kind: http-request
url: "{{baseUrl}}/api/v1/passenger-types"
method: GET
scripts:
  - type: afterResponse
    code: |-
      const types = pm.response.json();
      const prices = [900000, 450000, 0];
      pm.collectionVariables.set('pricesJson', JSON.stringify(types.map((t, i) => ({ passengerTypeId: t.id, price: prices[i] ?? 0 }))));
      pm.collectionVariables.set('onePriceJson', JSON.stringify([{ passengerTypeId: types[0].id, price: 900000 }]));
      pm.test('Trả 200', () => pm.response.to.have.status(200));
    language: text/javascript
order: 4000
