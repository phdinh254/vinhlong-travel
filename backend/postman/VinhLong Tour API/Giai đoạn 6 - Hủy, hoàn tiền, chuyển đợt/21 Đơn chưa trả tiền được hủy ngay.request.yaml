$kind: http-request
url: "{{baseUrl}}/api/v1/bookings/{{cxCode2}}/cancellation-requests"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "scope": "FULL",
      "phone": "0909333444"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('Trả 201', () => pm.response.to.have.status(201));
      const b = pm.response.json();
      pm.test('Tự duyệt, đơn hủy, không phải hoàn tiền', () => { pm.expect(b.status).to.eql('CANCELLED'); pm.expect(b.cancellationRequests[0].status).to.eql('APPROVED'); pm.expect(b.refundDue).to.eql(0); });
    language: text/javascript
order: 22000
