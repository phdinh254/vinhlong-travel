$kind: http-request
url: "{{baseUrl}}/api/v1/admin/bookings/{{cxBookingId}}/refunds"
method: POST
headers:
  Authorization: Bearer {{adminToken}}
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "amount": {{cxRefundDue}},
      "method": "BANK_TRANSFER",
      "transactionNo": "HT001",
      "proofUrl": "/uploads/chung-tu-hoan.jpg",
      "cancellationRequestId": {{cxRequestId}}
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('Trả 201', () => pm.response.to.have.status(201));
      const b = pm.response.json();
      pm.test('Không còn nợ khách, có 1 lần hoàn gắn với yêu cầu', () => { pm.expect(b.refundDue).to.eql(0); pm.expect(b.refunds.length).to.eql(1); pm.expect(b.refunds[0].cancellationRequestId).to.eql(Number(pm.collectionVariables.get('cxRequestId'))); });
    language: text/javascript
order: 15000
