$kind: http-request
url: "{{baseUrl}}/api/v1/admin/cancellation-requests/{{cxRequestId}}/approve"
method: POST
headers:
  Authorization: Bearer {{adminToken}}
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "note": "Đồng ý hủy"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('Trả 200', () => pm.response.to.have.status(200));
      const b = pm.response.json();
      pm.test('Còn 1 chỗ, người thứ hai đã hủy', () => { pm.expect(b.seats).to.eql(1); pm.expect(b.passengers[1].status).to.eql('CANCELLED'); });
      pm.test('Số tiền cần hoàn = tiền hoàn dự kiến', () => pm.expect(b.refundDue).to.eql(Number(pm.collectionVariables.get('cxEstimatedRefund'))));
      pm.collectionVariables.set('cxRefundDue', b.refundDue);
    language: text/javascript
order: 12000
