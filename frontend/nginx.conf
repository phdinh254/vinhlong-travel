server {
    listen 80;
    root /usr/share/nginx/html;

    # Ảnh tải lên tối đa 5 MB (khớp spring.servlet.multipart của backend); mặc định nginx chỉ cho 1 MB
    client_max_body_size 6m;

    location ~ ^/(api|uploads)/ {
        proxy_pass http://backend:8081;
        # Giữ cả cổng trong Host để backend thấy request cùng nguồn với trang, không coi là CORS
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # React Router: mọi đường dẫn không phải file đều trả về index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
