# Chạy cả hệ thống (MySQL + backend + frontend): docker compose up -d --build  → http://localhost:8080
# Chỉ chạy CSDL để tự chạy backend bằng ./mvnw:   docker compose up -d mysql
# Tài khoản chỉ dùng trên máy cá nhân; khớp giá trị mặc định trong backend/src/main/resources/application.yml
services:
  backend:
    build: ./backend
    container_name: vinhlongtour-backend
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      DB_URL: jdbc:mysql://mysql:3306/vinhlongtour
      # dev: có sẵn mật khẩu admin, khóa JWT và nạp dữ liệu demo (xem README).
      # Không truyền biến rỗng (JWT_SECRET=...): Spring coi chuỗi rỗng là đã đặt và bỏ qua giá trị mặc định của dev
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev}
      CORS_ORIGINS: http://localhost:8080,http://localhost:5173
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      # Khóa payOS đặt trong file .env cạnh file này (xem README); thiếu thì nút thanh toán báo PAYOS_NOT_CONFIGURED
      PAYOS_CLIENT_ID: ${PAYOS_CLIENT_ID:-}
      PAYOS_API_KEY: ${PAYOS_API_KEY:-}
      PAYOS_CHECKSUM_KEY: ${PAYOS_CHECKSUM_KEY:-}
      PAYOS_RETURN_URL: http://localhost:8080/thanh-toan/ket-qua
      PAYOS_CANCEL_URL: http://localhost:8080/thanh-toan/ket-qua
    ports:
      - "8081:8081"   # Swagger: http://localhost:8081/swagger-ui.html
    volumes:
      - uploads:/app/uploads

  frontend:
    build:
      context: ./frontend
      args:
        VITE_GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
    container_name: vinhlongtour-frontend
    depends_on:
      - backend
    ports:
      - "8080:80"


  mysql:
    image: mysql:8.4
    container_name: vinhlongtour-mysql
    # utf8mb4_0900_as_ci: không phân biệt hoa/thường nhưng phân biệt dấu tiếng Việt ("Chùa Âng" khác "Chua Ang")
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_0900_as_ci"]
    environment:
      MYSQL_DATABASE: vinhlongtour
      MYSQL_USER: vinhlong
      MYSQL_PASSWORD: vinhlong
      MYSQL_ROOT_PASSWORD: vinhlong-root
      TZ: Asia/Ho_Chi_Minh
    ports:
      - "${DB_PORT:-3306}:3306"
    volumes:
      - mysqldata:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uvinhlong -pvinhlong --silent"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  mysqldata:
  uploads:
