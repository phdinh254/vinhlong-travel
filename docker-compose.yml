# CSDL PostgreSQL cho môi trường phát triển. Chạy: docker compose up -d
# Tài khoản chỉ dùng trên máy cá nhân; khớp giá trị mặc định trong backend/src/main/resources/application.yml
services:
  postgres:
    image: postgres:17-alpine
    container_name: vinhlongtour-db
    environment:
      POSTGRES_DB: vinhlongtour
      POSTGRES_USER: vinhlong
      POSTGRES_PASSWORD: vinhlong
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vinhlong -d vinhlongtour"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
